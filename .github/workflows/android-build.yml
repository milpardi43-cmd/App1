name: Build MiloMultiApp Android APK

on:
  workflow_dispatch:
    inputs:
      apk_delivery_url:
        description: Temporary one-time URL for delivering the APK to this workspace
        required: false
        type: string
      apk_delivery_token:
        description: One-time upload token for the APK delivery URL
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Load and validate public Supabase app settings
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('config/supabase.public.json', 'utf8'));
          const url = String(config.EXPO_PUBLIC_SUPABASE_URL || '').trim();
          const key = String(config.EXPO_PUBLIC_SUPABASE_ANON_KEY || '').trim();
          let parsedUrl;
          try { parsedUrl = new URL(url); } catch {}
          if (!parsedUrl || parsedUrl.protocol !== 'https:' || parsedUrl.hostname.includes('example.com') || url.toLowerCase().includes('placeholder')) {
            throw new Error('Public Supabase app URL is missing or invalid.');
          }
          if (!key || key.toLowerCase().includes('placeholder') || key.includes('your-anon-key')) {
            throw new Error('Public Supabase app key is missing or invalid.');
          }
          if (key.startsWith('sb_secret_')) throw new Error('A secret Supabase key cannot be bundled in the app.');
          if (key.startsWith('eyJ')) {
            let payload;
            try { payload = JSON.parse(Buffer.from(key.split('.')[1], 'base64url').toString()); }
            catch { throw new Error('The public Supabase key is not a valid JWT.'); }
            if (payload.role !== 'anon') throw new Error('Only a public anon key may be bundled in the app.');
          }
          if (url.includes(String.fromCharCode(10)) || key.includes(String.fromCharCode(10))) {
            throw new Error('Supabase settings must be single-line values.');
          }
          fs.appendFileSync(process.env.GITHUB_ENV,
            `EXPO_PUBLIC_SUPABASE_URL=${url}\nEXPO_PUBLIC_SUPABASE_ANON_KEY=${key}\n`);
          NODE

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "Android SDK directory was not found at $SDK_ROOT."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [[ ! -d "$SDK_ROOT/platforms/android-36" || ! -d "$SDK_ROOT/build-tools/36.0.0" ]]; then
            if [[ -z "$SDKMANAGER" ]]; then
              echo "Android SDK 36 is missing and sdkmanager was not found."
              exit 1
            fi
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Deliver APK to the requesting workspace
        if: ${{ inputs.apk_delivery_url != '' && inputs.apk_delivery_token != '' }}
        env:
          APK_DELIVERY_URL: ${{ inputs.apk_delivery_url }}
          APK_DELIVERY_TOKEN: ${{ inputs.apk_delivery_token }}
        run: |
          echo "::add-mask::$APK_DELIVERY_TOKEN"
          case "$APK_DELIVERY_URL" in
            https://[0-9]*-*.e2b.app/upload) ;;
            *) echo "Refusing to send the APK to a non-workspace host."; exit 1 ;;
          esac
          if [[ ${#APK_DELIVERY_TOKEN} -ne 64 || "$APK_DELIVERY_TOKEN" == *[!0-9a-f]* ]]; then
            echo "The one-time APK delivery token is invalid."
            exit 1
          fi
          curl --fail --silent --show-error --connect-timeout 20 --max-time 600 -X POST -H "Authorization: Bearer $APK_DELIVERY_TOKEN" -H "Content-Type: application/vnd.android.package-archive" --data-binary @android/app/build/outputs/apk/debug/app-debug.apk "$APK_DELIVERY_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiloMultiApp-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
